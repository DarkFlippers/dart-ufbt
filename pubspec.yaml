name: dartufbt
description: Native Dart port of uFBT - Flipper Zero SDK deployment and FAP build tool.
version: 0.1.2
repository: https://github.com/DarkFlippers/dart-ufbt
issue_tracker: https://github.com/DarkFlippers/dart-ufbt/issues
topics: [flipper-zero, embedded, sdk, build-tool]

platforms:
  linux:
  macos:
  windows:

environment:
  # What this package is actually verified on - see CI, which pins no version
  # and so resolves to current stable. Declaring a lower floor promises a
  # window nobody has built in.
  sdk: ^3.13.1

dependencies:
  archive: ^4.0.0
  crypto: ^3.0.7
  image: ^4.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
